    <style>
        body {
            margin: 0;
            background-color: #030303;
            color: #00ff55;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .header {
            border-bottom: 1px solid #00ff55;
            padding-bottom: 8px;
            margin-bottom: 8px;
            font-size: 11px;
            color: #ff3333;
            text-transform: uppercase;

        }
        .console {
            flex-grow: 1;
            font-size: 11px;
            line-height: 1.4;
            overflow-y: hidden;
            white-space: pre-wrap;
            word-break: break-all;
            background: #000;
            border: 1px solid #113311;
            padding: 8px;
            border-radius: 3px;
        }
        .status-box {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 10px;
            border-radius: 4px;
            font-size: 11px;
            margin-top: 8px;
        }
        .progress-bar {
            width: 100%;
            background: #151515;
            height: 6px;
            border-radius: 3px;
            margin-top: 6px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .progress-fill {
            height: 100%;
            background: #ff3333;
            width: 0%;
        }
        .warning {
            color: #ff3333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div>
        <div class="header">
            <span>⚠️ CRITICAL KERNEL EXCEPTION // SEC-CORE v9.4</span>
            <span id="ip-tag">IP: 192.168.1.104</span>
        </div>
        <div class="console" id="console">INITIALIZING LOW-LEVEL HARDWARE INTERRUPT...<br>BYPASSING SELINUX ENFORCING MODE... OK<br></div>

    <div class="status-box">
        <div id="current-task">Сканирование системных разделов...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="bar"></div>

    <script>
        document.getElementById('ip-tag').innerText = "IP: " + 
            Math.floor(Math.random()*150 + 50) + '.' + 
            Math.floor(Math.random()*200) + '.' + 
            Math.floor(Math.random()*200) + '.' + 
            Math.floor(Math.random()*200);

        const heavyLogs = [
            "Mounting rootfs as read-write...",
            "Allocating virtual DMA buffer at 0x7fff5fbff800...",
            "Reading partition table from /dev/block/mmcblk0...",
            "Found partition: /dev/block/bootdevice/by-name/userdata",
            "Extracting keystore database from /data/system/users/0/...",
            "Decrypting master key using hardware entropy...",
            "Injecting payload into zygote64 process space...",
            "Opening raw socket raw_packet_send() -> 44.230.12.99:443",
            "Dumping SQLite database: /data/data/org.telegram.messenger/databases/cache4.db",
            "Compressing media files archive (DCIM/Camera/*)...",
            "Uploading chunk 0x004A1 to remote storage node...",
            "Uploading chunk 0x004A2 to remote storage node...",
            "Bypassing biometric authorization layer (FaceID/Fingerprint)...",
            "Acquiring root shell access via CVE-2026-EXPLOIT...",
            "Disabling local security notifications and heads-up popups...",
            "Overwriting recovery partition headers...",
            "Establishing persistent backdoor listener on port 31337...",
            "Syncing local logs with remote command center..."
        ];

        let logIndex = 0;
        const consoleEl = document.getElementById('console');
        
        setInterval(() => {
            if (logIndex < heavyLogs.length) {
                consoleEl.innerHTML += `> ${heavyLogs[logIndex]}\n`;
                consoleEl.scrollTop = consoleEl.scrollHeight;
                logIndex++;
            }
        }, 350);

        const tasks = [
            { text: "Анализ структуры шифрования памяти...", speed: 25 },
            { text: "Сбор учетных данных и токенов сессий...", speed: 18 },
            { text: "Экспорт галереи, видео и документов...", speed: 12 },
            { text: "Скачивание баз данных мессенджеров...", speed: 15 },
            { text: "Установка скрытого системного сервиса...", speed: 20 },
            { text: "Блокировка интерфейса и аппаратных кнопок...", speed: 30 }
        ];

        let taskIndex = 0;
        const taskEl = document.getElementById('current-task');
        const barEl = document.getElementById('bar');

        function runTaskChain() {
            if (taskIndex >= tasks.length) {
                taskEl.innerHTML = "<span class='warning'>[CRITICAL FATAL] Устройство заблокировано. Ядро повреждено.</span>";
                barEl.style.backgroundColor = "#ff0000";
                barEl.style.width = "100%";
                consoleEl.innerHTML += "\n[!] ROOT KIT INSTALLED SUCCESSFULLY.\n[!] WAITING FOR REMOTE COMMAND...\n";
                return;
            }

            let currentTask = tasks[taskIndex];
            taskEl.innerText = currentTask.text;
            let progress = 0;

            let interval = setInterval(() => {
                progress += Math.floor(Math.random() * 4) + 1;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    consoleEl.innerHTML += `[SUCCESS] ${currentTask.text} [100%]\n`;
                    consoleEl.scrollTop = consoleEl.scrollHeight;
                    taskIndex++;
                    setTimeout(runTaskChain, 300);
                }
                barEl.style.width = progress + "%";
            }, currentTask.speed);
        }

        setTimeout(runTaskChain, 800);
    </script>
</body>
